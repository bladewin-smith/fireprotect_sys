[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolov26-fire-rgbd"
version = "0.1.0"
description = "YOLO26 fire detection and Orbbec Gemini 336L RGB-D localization"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "PyYAML>=6,<7",
  "ultralytics>=8.4.62,<9",
  "pyorbbecsdk2>=2.1.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

